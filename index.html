<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>線上婚宴 Online Wedding Banquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Shippori+Mincho:wght@500;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#7a1414;--bg2:#5c0e0e;--surface:#fff7ea;--surface2:#fbe9d0;--ink:#3a1410;--muted:#8a5a4a;
  --accent:#c8102e;--accent-ink:#fff;--gold:#d4a64a;--line:rgba(140,60,30,.18);--on-bg:#f8e3b5;
  --radius:6px;--font-display:"Noto Serif TC",serif;--pattern:none;--shadow:0 10px 30px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:var(--pattern);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;min-height:100vh;transition:background-color .5s}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 18px;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(8px);color:var(--bar-ink);border-bottom:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.topbar .brand .em{width:34px;height:34px;flex:none;color:var(--gold)}
.topbar .brand .em{--accent:var(--bar-ink)}
.topbar .brand .names{font-family:var(--font-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand small{display:block;font-size:11px;opacity:.75;font-family:"Noto Sans TC"}
.tb-btn{border:1px solid color-mix(in srgb,var(--bar-ink) 40%,transparent);background:transparent;color:var(--bar-ink);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}
.tb-btn:hover{background:color-mix(in srgb,var(--bar-ink) 12%,transparent)}
.tb-btn.on{background:var(--gold);color:var(--bg2);border-color:var(--gold)}
.sync{font-size:11px;opacity:.75;white-space:nowrap}
/* layout */
.app.solo{grid-template-columns:1fr}.app.solo nav.steps{display:none}
.livebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);color:var(--ink);border:1px solid var(--accent);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:14px;box-shadow:var(--shadow)}
.ldot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}.ldot.on{background:#e0393e;animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.3}}
.app{display:grid;grid-template-columns:230px 1fr;gap:22px;max-width:1280px;margin:0 auto;padding:22px 18px 80px}
nav.steps{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:4px}
nav.steps button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:var(--on-bg);padding:9px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;opacity:.82}
nav.steps button:hover{opacity:1;background:color-mix(in srgb,var(--on-bg) 10%,transparent)}
nav.steps button.cur{opacity:1;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
nav.steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1px solid currentColor;flex:none;font-family:var(--font-display)}
nav.steps button.cur .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);position:relative}
.card+.card{margin-top:18px}
.card.deco::before{content:"";position:absolute;inset:7px;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:calc(var(--radius) - 2px);pointer-events:none}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{font-size:26px;color:var(--on-bg)}
.sec-head p{margin:4px 0 0;color:var(--on-bg);opacity:.8;font-size:14px}
.kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-text)}
.sec-head .kicker{color:var(--kicker-bg)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:var(--radius);cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1e1408}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.big{padding:14px 26px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--surface2);color:var(--accent);border:2px solid var(--gold);overflow:hidden;flex:none;font-family:var(--font-display);line-height:1;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avup{position:relative;overflow:hidden;cursor:pointer}.avup input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.mates{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.mate{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;text-align:center;font-size:12px;word-break:break-all}
.plan .seat-me circle{animation:pulse 1.2s ease-in-out infinite}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.x:hover{color:var(--accent)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input.i,select.i,textarea.i{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:color-mix(in srgb,var(--surface) 70%,var(--surface2));outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea.i{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:color-mix(in srgb,#3c9a5f 18%,var(--surface));color:color-mix(in srgb,#2d7a49 65%,var(--ink));border-color:color-mix(in srgb,#3c9a5f 40%,transparent)}
.pill.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:12px;color:var(--muted);font-weight:500}
.stat{background:var(--surface2);border-radius:var(--radius);padding:14px;text-align:center}
.stat b{display:block;font-size:26px;font-family:var(--font-display);color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:var(--radius);background:color-mix(in srgb,var(--gold) 22%,var(--surface));border:1px dashed var(--gold);font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* hero */
.hero{text-align:center;padding:44px 24px 36px}
.hero .em{width:96px;height:96px;margin:0 auto 10px;color:var(--accent)}
.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.2;color:var(--ink)}
.hero h1 .amp{color:var(--gold-text);font-family:"Cormorant Garamond",serif;font-style:italic;padding:0 .2em}
.hero .msg{max-width:520px;margin:14px auto;color:var(--muted);line-height:1.8}
.hero .meta{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:18px 0 6px;font-size:15px}
.hero .meta div span{display:block;font-size:11px;color:var(--muted);letter-spacing:.15em}
.countdown{display:flex;justify-content:center;gap:10px;margin:18px 0 22px}
.countdown div{background:var(--surface2);border-radius:var(--radius);padding:8px 14px;min-width:66px}
.countdown b{display:block;font-size:24px;font-family:var(--font-display);color:var(--accent)}
.countdown span{font-size:11px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:62px 18px 1fr auto;gap:10px;align-items:center;padding:8px 0}
.timeline .tm{font-family:var(--font-display);color:var(--muted);font-size:14px;text-align:right}
.timeline .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);background:var(--surface);position:relative}
.timeline li.done .dot{background:var(--gold)}
.timeline li.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 20%,transparent)}
.timeline li.now .tt{font-weight:700;color:var(--accent)}
.flowgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.flowgrid button{border:1px solid var(--line);background:var(--surface2);border-radius:var(--radius);padding:14px 12px;cursor:pointer;text-align:left;transition:transform .15s}
.flowgrid button:hover{transform:translateY(-2px);border-color:var(--gold)}
.flowgrid b{display:block;font-family:var(--font-display);font-size:15px;margin-top:4px}
.flowgrid small{color:var(--muted);font-size:12px}
/* blessings */
.wall{columns:3 220px;column-gap:14px}
.bcard{break-inside:avoid;margin:0 0 14px;padding:16px 16px 12px;border-radius:var(--radius);box-shadow:0 6px 16px rgba(0,0,0,.12);position:relative;animation:pop .5s ease both;color:#2b2420}
.bcard p{margin:0 0 10px;line-height:1.7;white-space:pre-wrap;word-break:break-word;font-family:var(--font-display)}
.bcard .by{font-size:12px;opacity:.7;display:flex;justify-content:space-between}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.colors{display:flex;gap:8px}
.colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.colors button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
/* gift */
.env-wrap{display:grid;place-items:center;padding:10px}
.env-wrap svg{width:min(260px,100%);height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.2))}
.env-wrap.sealed svg{animation:seal .9s ease}
@keyframes seal{0%{transform:scale(1)}30%{transform:scale(.92) rotate(-3deg)}60%{transform:scale(1.06) rotate(2deg)}100%{transform:none}}
.pm{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;background:var(--surface2);display:flex;align-items:center;gap:10px}
.pm.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.pm .ic{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.payinfo{margin-top:14px;padding:16px;border-radius:var(--radius);border:1px dashed var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--surface))}
.payinfo .acct{font-family:ui-monospace,monospace;font-size:17px;letter-spacing:.04em;word-break:break-all}
.payinfo img{max-width:200px;border-radius:8px;display:block;margin-top:10px;background:#fff;padding:6px}
/* seating */
.seatwrap{display:grid;grid-template-columns:1fr 300px;gap:18px}
.plan{width:100%;height:auto;display:block;background:var(--surface2);border-radius:var(--radius);touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.plan.edit{touch-action:none}
.plan .tbl{cursor:pointer}
.plan .tbl circle.top{transition:stroke-width .2s}
.plan .tbl.sel circle.top{stroke-width:4}
.plan .tbl.mine circle.top{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:7}}
.plan.edit .tbl{cursor:grab}
.walker{transition:none}
/* menu */
.menucard{text-align:center;padding:30px 24px}
.menucard ol{list-style:none;padding:0;margin:16px 0 0}
.menucard li{padding:9px 0;border-bottom:1px dotted var(--line);font-family:var(--font-display);font-size:16px}
.menucard li small{display:block;color:var(--muted);font-family:"Noto Sans TC";font-size:12px}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .5s}
/* champagne */
.stage-svg{width:100%;max-width:560px;display:block;margin:0 auto}
.liq{transform:scaleY(0);transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s linear}
.ovf{opacity:0}
.liq.full{transform:scaleY(1)}
.bub{opacity:0}
.full~.bubs .bub,.bubs.on .bub{animation:bub 1.8s linear infinite;opacity:.8}
@keyframes bub{from{transform:translateY(0);opacity:.9}to{transform:translateY(-16px);opacity:0}}
.stream{stroke-dasharray:4 6;animation:flow .4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.bigword{font-family:var(--font-display);font-size:clamp(34px,6vw,60px);color:var(--accent);text-align:center;animation:pop .6s ease both}
/* games */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid color-mix(in srgb,var(--on-bg) 40%,transparent);background:transparent;color:var(--on-bg);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.qbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:18px}
.qbtns button{padding:26px 10px;border-radius:var(--radius);border:2px solid var(--line);background:var(--surface2);cursor:pointer;font-family:var(--font-display);font-size:20px;transition:all .2s}
.qbtns button:hover{border-color:var(--accent)}
.qbtns button.right{background:#3c9a5f;color:#fff;border-color:#3c9a5f}
.qbtns button.wrong{background:#b94a48;color:#fff;border-color:#b94a48}
.slot{height:110px;display:grid;place-items:center;border-radius:var(--radius);background:var(--bg2);color:var(--bar-ink);font-family:var(--font-display);font-size:clamp(28px,5vw,46px);margin:14px 0;overflow:hidden;border:3px double var(--gold)}
/* bouquet */
.bq svg{width:100%;height:auto;display:block;background:var(--surface2);border-radius:var(--radius)}
.cdown{position:fixed;inset:0;display:grid;place-items:center;z-index:60;pointer-events:none;font-family:var(--font-display);font-size:160px;color:var(--gold);text-shadow:0 6px 30px rgba(0,0,0,.35)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);color:var(--ink);border-radius:calc(var(--radius) + 4px);width:min(860px,100%);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.4);position:relative}
.modal.wide{width:min(1080px,100%)}
.modal .close{position:absolute;right:12px;top:10px}
.setnav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 6px;position:sticky;top:-24px;background:var(--surface);padding:10px 0;z-index:2;border-bottom:1px solid var(--line)}
.setnav button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.setnav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.themegrid h3{margin:18px 0 10px;font-size:18px}
.themegrid.compact h3{margin:12px 0 6px;font-size:14px}.themegrid.compact .grid3{gap:8px;grid-template-columns:repeat(3,1fr)}.themegrid.compact .tcard .pv{height:62px}.themegrid.compact .tcard .pv .em{width:36px;height:36px}.themegrid.compact .tcard .lb{padding:6px 8px}.themegrid.compact .tcard .lb b{font-size:13px}.themegrid.compact .tcard .lb small{display:none}.themegrid.compact .tcard .sw{display:none}
.tcard{border-radius:10px;overflow:hidden;cursor:pointer;border:3px solid transparent;transition:transform .2s;text-align:left;padding:0;background:none}
.tcard:hover{transform:translateY(-3px)}
.tcard.on{border-color:var(--accent)}
.tcard .pv{height:120px;display:grid;place-items:center;position:relative}
.tcard .pv .em{width:58px;height:58px}
.tcard .pv .sw{position:absolute;bottom:8px;right:8px;display:flex;gap:4px}
.tcard .pv .sw i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.tcard .lb{padding:10px 12px;background:var(--surface2)}
.tcard .lb b{display:block;font-size:15px}
.tcard .lb small{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 20px;border-radius:999px;z-index:70;font-size:14px;box-shadow:var(--shadow);animation:fade .2s}
.pmedit{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:var(--surface2)}
.big-overlay{position:fixed;inset:0;z-index:45;background:var(--bg);background-image:var(--pattern);display:grid;place-items:center;padding:40px;color:var(--on-bg);text-align:center}
.big-overlay .bq-text{font-family:var(--font-display);font-size:clamp(28px,4.5vw,54px);line-height:1.6;max-width:1000px;animation:pop .8s ease both}
body.pride .topbar::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#004dff,#750787)}
body.pride .hero::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#004dff,#750787);border-radius:var(--radius) var(--radius) 0 0}
.roles{font-size:13px;color:var(--muted);margin-top:8px}
.troute{position:relative;display:flex;gap:6px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin-top:12px;padding-top:4px;overflow-x:auto;scrollbar-width:none}
.troute.has{padding-top:44px}
.tstop{flex:1;min-width:62px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--radius);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink)}
.tstop span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--gold);font-size:13px}
.tstop.done span{background:var(--gold);color:#1e1408}.tstop.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.tstop.now span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tstop small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tcouple{position:absolute;top:2px;display:flex;transition:left .9s cubic-bezier(.4,1.5,.5,1);animation:hop .7s ease-in-out infinite alternate}.tcouple .av{box-shadow:0 2px 6px rgba(0,0,0,.25)}.tcouple .av+.av{margin-left:-10px}
@keyframes hop{to{transform:translateY(-5px)}}
.tscene{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.tside{text-align:center}
.clink{display:flex;align-items:flex-end;justify-content:center;color:var(--ink);min-width:120px;position:relative;cursor:pointer;padding-top:20px}
.gl-l{transform:rotate(-14deg) translateX(-4px)}.gl-r{transform:rotate(14deg) translateX(4px)}
.clink.go .gl-l{animation:clinkL .9s ease}.clink.go .gl-r{animation:clinkR .9s ease}.clink.go .spark{animation:spark .9s ease}
@keyframes clinkL{0%,100%{transform:rotate(-14deg) translateX(-4px)}40%{transform:rotate(10deg) translateX(12px)}55%{transform:rotate(4deg) translateX(7px)}}
@keyframes clinkR{0%,100%{transform:rotate(14deg) translateX(4px)}40%{transform:rotate(-10deg) translateX(-12px)}55%{transform:rotate(-4deg) translateX(-7px)}}
.spark{position:absolute;top:0;left:50%;font-size:30px;opacity:0;transform:translateX(-50%)}
@keyframes spark{0%,35%{opacity:0;transform:translateX(-50%) scale(.2)}45%{opacity:1;transform:translateX(-50%) scale(1.4)}100%{opacity:0;transform:translateX(-50%) translateY(-22px) scale(1)}}

const FB_RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /weddings/{wid} {
      function signedIn() { return request.auth != null; }
      function isHost() {
        return signedIn() && exists(/databases/$(database)/documents/weddings/$(wid)/hosts/$(request.auth.uid));
      }
      function isMember() {
        return isHost() || (signedIn() && exists(/databases/$(database)/documents/weddings/$(wid)/members/$(request.auth.uid)));
      }
      function secret() {
        return get(/databases/$(database)/documents/weddings/$(wid)/private/key).data;
      }

      allow read: if true;
      allow create: if signedIn() && request.resource.data.owner == request.auth.uid;
      allow update: if isHost() && request.resource.data.owner == resource.data.owner;

      match /private/{docId} {
        allow read, write: if isHost();
      }
      match /hosts/{uid} {
        allow read: if signedIn() && request.auth.uid == uid;
        allow create: if signedIn() && request.auth.uid == uid
          && (get(/databases/$(database)/documents/weddings/$(wid)).data.owner == uid
              || request.resource.data.key == secret().hostKey);
      }
      match /members/{uid} {
        allow read: if signedIn() && request.auth.uid == uid;
        allow create, update: if signedIn() && request.auth.uid == uid
          && (secret().inviteCode == '' || request.resource.data.code == secret().inviteCode);
        allow delete: if isHost();
      }
      match /data/{docId} {
        allow read: if isMember();
        allow create, delete: if isHost();
        allow update: if isHost() || (isMember() && docId in ['guests', 'blessings', 'avatars0', 'avatars1', 'avatars2', 'avatars3']);
      }
      match /gifts/{giftId} {
        allow create: if isMember();
        allow read, update, delete: if isHost();
      }
      match /bgm/{part} {
        allow read: if isMember();
        allow write: if isHost();
      }
    }
  }
}`;

/* ============ particles ============ */
const FX=(()=>{
  const c=document.getElementById('fx'),x=c.getContext('2d');let W,H,ps=[],kind='confetti',cols=['#d4a64a'],dpr=1;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
  addEventListener('resize',size);size();
  function mk(burst,ox,oy){const a=Math.random()*Math.PI*2,sp=burst?4+Math.random()*7:0;return{x:burst?ox:Math.random()*W,y:burst?oy:-20-Math.random()*H*.5,vx:burst?Math.cos(a)*sp:(Math.random()-.5)*.6,vy:burst?Math.sin(a)*sp-4:.5+Math.random()*1,r:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.08,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],ph:Math.random()*6,life:burst?1:Infinity,burst}}
  function draw(p){x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=p.burst?Math.max(0,p.life):.75;const s=p.s;
    if(kind==='confetti'){x.scale(1,Math.cos(p.ph));x.fillRect(-s/2,-s/4,s,s/2)}
    else if(kind==='sparkle'){x.beginPath();for(let i=0;i<8;i++){const rr=i%2?s*.18:s*.6,a=i*Math.PI/4;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.fill()}
    else if(kind==='leaf'||kind==='maple'){x.beginPath();x.moveTo(0,-s*.8);x.quadraticCurveTo(s*.7,0,0,s*.8);x.quadraticCurveTo(-s*.7,0,0,-s*.8);x.fill()}
    else if(kind==='sakura'){x.beginPath();x.moveTo(0,s*.7);x.bezierCurveTo(s*.7,s*.2,s*.5,-s*.6,s*.12,-s*.6);x.lineTo(0,-s*.35);x.lineTo(-s*.12,-s*.6);x.bezierCurveTo(-s*.5,-s*.6,-s*.7,s*.2,0,s*.7);x.fill()}
    else{x.beginPath();x.ellipse(0,0,s*.35,s*.65,0,0,Math.PI*2);x.fill()}
    x.restore()}
  let ambientN=0;
  function loop(){x.clearRect(0,0,W,H);
    while(ps.filter(p=>!p.burst).length<ambientN)ps.push(mk(false));
    ps.forEach(p=>{p.ph+=.1;p.r+=p.vr;if(p.burst){p.vy+=.18;p.vx*=.985;p.life-=.007}else{p.vx+=Math.sin(p.ph*.3)*.02}p.x+=p.vx;p.y+=p.vy;draw(p)});
    ps=ps.filter(p=>p.burst?p.life>0&&p.y<H+40:p.y<H+30);
    requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  return{setAmbient(k,cs){kind=k;cols=cs;ambientN=reduce?0:(innerWidth<600?10:18);ps=ps.filter(p=>p.burst)},
    burst(n=90,ox=W/2,oy=H/2){if(reduce)return;for(let i=0;i<n;i++)ps.push(mk(true,ox,oy))}};
})();

let animN=0;function animStart(){animN++}function animEnd(){animN=Math.max(0,animN-1);if(!animN&&pendingRender)setTimeout(()=>{if(!animN&&pendingRender&&!busy()){pendingRender=false;render()}},80)}
function softRender(){if(busy()||animN>0){pendingRender=true;return}pendingRender=false;render()}
document.getElementById('main').addEventListener('input',e=>{const t=e.target;if(t.id&&!NODRAFT.includes(t.id)&&!/checkbox|radio|file/.test(t.type))ui.drafts[t.id]=t.value});
document.getElementById('main').addEventListener('change',e=>{const t=e.target;if(t.id&&t.tagName==='SELECT'&&!NODRAFT.includes(t.id))ui.drafts[t.id]=t.value});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!busy()){pendingRender=false;render()}},200));
function gateView(){const t=TH(settings.theme),g=grp();return `<div class="card deco hero" style="max-width:600px;margin:20px auto">${heroMark(t)}<div class="kicker">${esc(settings.eventName||g.event)}</div><h1 style="font-size:clamp(26px,4vw,36px)">${P().map(p=>esc(p.name)).join('<span class="amp">&amp;</span>')}</h1>
  <p class="msg">這是一場私人的線上婚禮，請輸入新人提供的邀請碼。</p>
  <input class="i" id="gateIn" autocomplete="off" style="max-width:280px;margin:6px auto;display:block;text-align:center;font-size:26px;letter-spacing:.2em;text-transform:uppercase;font-family:ui-monospace,monospace" maxlength="9" placeholder="ABC-123" value="${esc(ui.gatePrefill)}" onkeydown="if(event.key==='Enter')tryCode()">
  <div style="margin-top:14px"><button class="btn big" onclick="tryCode()">進入婚禮 →</button></div><p id="gateErr" style="min-height:22px;color:var(--accent);font-size:14px"></p></div>`}
async function tryCode(){const v=document.getElementById('gateIn').value;if(!normCode(v))return;if(fb.on){const ok=await fbJoin(v);if(ok){FX.burst(140);toast('歡迎光臨！');render()}else document.getElementById('gateErr').textContent='邀請碼不正確，請再確認一次。';return}const h=await hashCode(v);if(h===(settings.access||{}).hash){setUnlock(h);ui.gatePrefill='';FX.burst(140);toast('歡迎光臨！');render()}else{document.getElementById('gateErr').textContent='邀請碼不正確，請再確認一次。'}}
function waitView(){const l=settings.live,t=TH(settings.theme),g=grp();return `<div class="card deco hero" style="max-width:760px;margin:10px auto">${heroMark(t)}<div class="kicker">${esc(settings.eventName||g.event)}</div><h1>${P().map(p=>esc(p.name)).join('<span class="amp">&amp;</span>')}</h1>
  <p class="msg">${l.startAt?`婚禮將於 <b>${esc(fmtDT(l.startAt))}</b> 開始。<br>時間一到，畫面會自動帶您進入婚禮，請不要關閉這個頁面。`:'新人準備好就會開始，請稍候，畫面會自動帶您進入婚禮。'}</p>
  ${l.startAt?`<div class="countdown" id="waitCd">${cdHTML(l.startAt)}</div>`:''}
  <p class="muted" style="font-size:13px">${esc(settings.invite||g.invite)}</p></div>
  <div class="card" style="max-width:760px;margin:18px auto 0"><h3>今日流程</h3><ul class="timeline" style="margin-top:10px">${program().map(x=>`<li><span class="tm">${esc(x[0])}</span><span class="dot"></span><span class="tt">${esc(x[1])}</span><span></span></li>`).join('')}</ul></div>`}
function liveBar(){
  if(!isSync())return '';const g=grp(),ls=settings.live.step,st=liveStarted(),lsName=esc(g.steps[ls]||ls);
  if(isHost())return `<div class="livebar"><span class="ldot ${st?'on':''}"></span><b>${st?'同步進行中':'等待開始'}</b><span>${st?`大家目前在：<b>${lsName}</b>`:settings.live.startAt?`預定 ${esc(fmtDT(settings.live.startAt))} 開始 <span id="liveCd">${cdText(settings.live.startAt)}</span>`:'尚未設定開始時間'}</span>
    <span class="row" style="margin-left:auto;gap:6px">${st?`<button class="btn sm ghost" onclick="liveMove(-1)">◀</button><button class="btn sm" onclick="liveMove(1)">下一環節 ▶</button>${ls!==step?`<button class="btn sm gold" onclick="liveTo(step)">把大家帶到這一頁</button>`:''}<button class="btn sm ghost" onclick="broadcast('confetti',step);FX.burst(220)">🎉 全場撒花</button>`:`<button class="btn sm" onclick="liveStart()">▶ 立即開始</button>`}<button class="btn sm ghost" onclick="openSettings('live')">設定</button></span></div>`;
  if(!st)return '';
  return `<div class="livebar"><span class="ldot on"></span>${ui.follow!==false?`<span>跟著新人一起進行中・目前：<b>${lsName}</b></span><button class="btn sm ghost" style="margin-left:auto" onclick="ui.follow=false;render()">自由瀏覽</button>`:`<span>新人目前在：<b>${lsName}</b></span><button class="btn sm" style="margin-left:auto" onclick="ui.follow=true;render()">跟上新人 →</button>`}</div>`}
function liveStart(){settings.live.started=true;if(!steps().includes(settings.live.step))settings.live.step=steps()[1]||'home';putSettings();step=settings.live.step;FX.burst(150);toast('婚禮開始！所有賓客的畫面都會跟著你');render()}
function liveTo(s){settings.live.step=s;step=s;putSettings();toast(`已把大家帶到「${grp().steps[s]}」`);render()}
function liveMove(d){const st=steps();let i=st.indexOf(settings.live.step);i=Math.max(0,Math.min(st.length-1,(i<0?0:i)+d));liveTo(st[i])}
const AFTER={};

const VIEWS={};

function moveNow(d){settings.nowIdx=Math.max(0,Math.min(program().length-1,(settings.nowIdx||0)+d));putSettings();render()}
function clearDemo(){guests={};blessings={};gifts={};demo=false;me=null;settings.winners=[];settings.bouquetWinner=null;settings.toastDone=[];saveLocal();toast('已清除示範資料');render()}

/* ---- check-in ---- */
VIEWS.checkin=()=>{
  const g=grp();
  if(isHost())return checkinHost();

  if(m){const t=tableById(m.table);
    return head('checkin','')+`<div class="card deco hero"><div class="kicker">WELCOME</div><div style="margin:8px auto 10px;width:max-content">${avHTML(avatarOf(m.id),m.name,96)}</div><h1 style="font-size:34px">歡迎 ${esc(m.name)}</h1>

   <div class="card deco"><h3>找到您的名字</h3>
    <input class="i" style="margin-top:12px;font-size:18px" placeholder="輸入姓名，例如：王大明" value="${esc(ui.search)}" autocomplete="off" id="ckS">
    <div id="ckRes">${ckRes()}</div>
   </div>
   ${walk?`   <div class="card"><h3>名單上沒有我</h3><p class="muted" style="font-size:13px">直接新增，系統會自動安排有空位的桌次。</p>
    <label class="f">姓名</label><input class="i" id="nwName">
    <label class="f">您是</label><select class="i" id="nwSide">${sideOpts().map(([v,s])=>`<option value="${v}">${esc(s)}</option>`).join('')}</select>
    <label class="f">與新人的關係</label><input class="i" id="nwRel" placeholder="例如：大學同學">
    <label class="f">出席人數</label><input class="i" id="nwCount" type="number" min="1" max="10" value="1">
    ${addons().bouquet?`<label class="row" style="margin-top:12px;font-size:14px"><input type="checkbox" id="nwBq"> 參加${esc(g.steps.bouquet)}</label>`:''}
    ${petsOn()?`<label class="f">🐾 攜帶毛孩（選填，多隻請用、分隔）</label><div class="row"><input class="i" id="nwPet" placeholder="毛孩名字" style="flex:1"><select class="i" id="nwPetK" style="width:90px">${PET_KINDS.map(k=>`<option>${k}</option>`).join('')}</select></div>`:''}
    <div style="margin-top:14px"><button class="btn" onclick="walkIn()">新增並報到</button></div>
   </div>`:''}
   </div>`;
};
function ckRes(){const g=grp();const q=ui.search.trim();const hits=q?Object.values(guests).filter(x=>nameMatch(x.name,q)).slice(0,8):[];const pick=ui.checkPick&&guests[ui.checkPick];
  return `${q?'':`<p class="muted" style="font-size:14px;line-height:1.7;margin:12px 2px 0">輸入姓名中的任何一個字，就會列出符合的賓客。<br>例如輸入「王」，再點選自己的名字。</p>${Object.keys(guests).length?'':`<p class="muted" style="font-size:13px;margin:8px 2px 0">（目前名單是空的，請新人先在「新人模式」建立賓客名單。）</p>`}`}
    <div style="margin-top:10px">${hits.map(x=>`<div class="pm ${ui.checkPick===x.id?'on':''}" style="margin-bottom:6px" onclick="ui.checkPick='${x.id}';render()"><div class="ic">${esc(x.name[0])}</div><div style="flex:1"><b>${esc(x.name)}</b><div class="muted" style="font-size:12px">${esc(sideLabel(x.side))} ・ ${esc(x.rel||'')}</div></div>${x.checked?'<span class="pill ok">已報到</span>':''}</div>`).join('')}

    ${pick?`<div class="payinfo"><b>${esc(pick.name)}</b>，確認一下：
     <label class="f">出席人數（含自己）</label><div class="row"><button class="btn sm ghost" onclick="adjCount('${pick.id}',-1)">－</button><b style="font-size:20px;min-width:30px;text-align:center">${pick.count}</b><button class="btn sm ghost" onclick="adjCount('${pick.id}',1)">＋</button></div>
     ${addons().bouquet?`<label class="row" style="margin-top:12px;font-size:14px"><input type="checkbox" ${pick.bouquet?'checked':''} onchange="guests['${pick.id}'].bouquet=this.checked"> 我想參加${esc(g.steps.bouquet)}</label>`:''}
     ${petsOn()?petEditor(pick.id):''}
     <label class="f">頭貼（選填，入席時會顯示在您的座位上）</label><div class="row">${avHTML(avatarOf(pick.id),pick.name,52)}${avUpBtn(pick.id)}</div>
     <div style="margin-top:14px"><button class="btn big" onclick="doCheckin('${pick.id}')">完成報到 ✓</button></div></div>`:''}
`}
function hostList(){const g=grp(),all=Object.values(guests).sort((a,b)=>(b.checked-a.checked)||(a.table||'zz').localeCompare(b.table||'zz'));const q=ui.search.trim();const list=q?all.filter(x=>nameMatch(x.name,q)):all;
  return `${list.length?`<div style="overflow-x:auto"><table class="t" style="margin-top:12px"><thead><tr><th>報到</th><th>姓名</th><th>身分</th><th>人數</th><th>桌次</th><th></th></tr></thead><tbody>
   ${list.map(x=>`<tr><td><input type="checkbox" ${x.checked?'checked':''} onchange="hostCheck('${x.id}',this.checked)"></td><td><div class="row" style="flex-wrap:nowrap;gap:8px"><label class="avup" title="點一下上傳頭貼">${avHTML(avatarOf(x.id),x.name,34)}<input type="file" accept="image/*" onchange="uploadAvatar('${x.id}',this.files[0]);this.value=''"></label><div><b>${esc(x.name)}</b>${petCount(x)?` <span class="pill">🐾×${petCount(x)}</span>`:''}<div class="muted" style="font-size:12px">${esc(x.rel||'')}</div></div></div></td><td>${esc(sideLabel(x.side))}</td>
   <td><input class="i" style="width:64px;padding:5px" type="number" min="1" value="${x.count}" onchange="guests['${x.id}'].count=guests['${x.id}'].invited=Math.max(1,+this.value||1);putGuest(guests['${x.id}'])"></td>
   <td><select class="i" style="padding:5px;min-width:110px" onchange="guests['${x.id}'].table=this.value||null;putGuest(guests['${x.id}']);render()"><option value="">未安排</option>${settings.tables.map(t=>`<option value="${t.id}" ${x.table===t.id?'selected':''}>${esc(tName(t))}</option>`).join('')}</select></td>
   <td><button class="x" title="刪除" onclick="if(window.confirmDel==='${x.id}'){delGuest('${x.id}');render()}else{window.confirmDel='${x.id}';toast('再按一次刪除')}">✕</button></td></tr>`).join('')}</tbody></table></div>`:q?`<div class="empty">找不到「${esc(q)}」</div>`:`<div class="empty">還沒有賓客。可以從「匯入名單」貼上整份名單，或逐一新增。</div>`}`}
function fndRes(){const q=ui.findName.trim();if(!q)return '';const hits=Object.values(guests).filter(x=>nameMatch(x.name,q)).slice(0,5);return hits.length?hits.map(h=>`<div class="row" style="gap:8px;margin:8px 0;flex-wrap:nowrap">${avHTML(avatarOf(h.id),h.name,32)}<span style="flex:1">${esc(h.name)} → <b>${esc(tName(tableById(h.table)))}</b></span>${h.table?`<button class="btn sm ghost" onclick="walkTo('${h.table}','${h.id}')">帶位</button>`:''}</div>`).join(''):'<p class="muted">找不到這個名字</p>'}
function bindSearch(id,apply){const el=document.getElementById(id);if(!el||el._bound)return;el._bound=true;let comp=false,last=el.value;
  const check=()=>{if(comp||!document.body.contains(el))return;if(el.value!==last){last=el.value;apply(el.value)}};
  el.addEventListener('compositionstart',()=>{comp=true});
  el.addEventListener('compositionend',()=>{comp=false;setTimeout(check,0)});
  el.addEventListener('input',e=>{if(!e.isComposing)comp=false;setTimeout(check,0)});
  ['keyup','change','paste','cut','blur'].forEach(ev=>el.addEventListener(ev,()=>{if(ev==='blur')comp=false;setTimeout(check,0)}));
  const iv=setInterval(()=>{if(!document.body.contains(el)){clearInterval(iv);return}check()},400)}
AFTER.checkin=()=>{bindSearch('ckS',v=>{ui.search=v;ui.checkPick=null;liveUpdate('ckRes',ckRes)});bindSearch('hS',v=>{ui.search=v;liveUpdate('hList',hostList)})};
function liveUpdate(id,fn){const el=document.getElementById(id);if(el)el.innerHTML=fn()}
const nameMatch=(n,q)=>String(n||'').toLowerCase().replace(/\s+/g,'').includes(String(q||'').toLowerCase().replace(/\s+/g,''));
function renderKeep(id){const el=document.getElementById(id);const pos=el?el.selectionStart:0;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
function adjCount(id,d){const x=guests[id];if(x.invited==null)x.invited=+x.count||1;const max=isHost()?12:x.invited;const n=Math.max(1,Math.min(max,(+x.count||1)+d));if(!isHost()&&(+x.count||1)+d>max)toast(`名單上登記 ${max} 位，如需增加請洽新人`);x.count=n;liveUpdate('ckRes',ckRes)}
function doCheckin(id){const x=guests[id];x.checked=true;x.ts=Date.now();if(!x.table)x.table=autoTable(x);putGuest(x);me=id;ui.search='';ui.checkPick=null;saveLocal();FX.burst(120);render()}
function walkIn(){const name=document.getElementById('nwName').value.trim();if(!name)return toast('請輸入姓名');
  const x={id:uid(),name,side:sv(document.getElementById('nwSide').value),rel:document.getElementById('nwRel').value.trim(),count:Math.max(1,+document.getElementById('nwCount').value||1),table:null,checked:false,bouquet:!!document.getElementById('nwBq')?.checked,diet:[],menu:null,note:'',ts:Date.now(),pets:(document.getElementById('nwPet')?.value||'').split(/[、,，\/]/).map(s=>s.trim()).filter(Boolean).map(n=>({name:n,kind:document.getElementById('nwPetK').value,size:'小型',meal:null,note:''}))};
  guests[x.id]=x;clearDrafts('nwName','nwRel','nwCount','nwPet','nwSide','nwPetK');doCheckin(x.id)}
function nextGuest(){me=null;ui.search='';saveLocal();render();setTimeout(()=>document.getElementById('ckS')?.focus(),50)}
function checkinHost(){
  const g=grp(),all=Object.values(guests).sort((a,b)=>(b.checked-a.checked)||(a.table||'zz').localeCompare(b.table||'zz'));
  const q=ui.search.trim();const list=q?all.filter(x=>x.name.includes(q)):all;
  const exp=headcount(false),arr=headcount(true);
  return head('checkin','新人模式：管理賓客名單與報到狀態。要讓賓客自己報到，請切換到「賓客模式」。',`<button class="btn sm gold" onclick="toggleRole()">切換到賓客報到畫面</button>`)+`
  <div class="grid3" style="margin-bottom:18px"><div class="stat"><b>${arr} / ${exp}</b><span>已報到人數 / 預計人數</span></div><div class="stat"><b>${Object.values(guests).filter(x=>x.checked).length}</b><span>已報到組數</span></div><div class="stat"><b>${Object.values(guests).filter(x=>!x.table).length}</b><span>尚未安排座位</span></div></div>
  <div class="card">
   <div class="row" style="justify-content:space-between"><input class="i" style="max-width:280px" placeholder="搜尋姓名" value="${esc(ui.search)}" autocomplete="off" id="hS"><span class="row"><button class="btn sm ghost" onclick="openSettings('guests')">匯入名單</button><button class="btn sm" onclick="quickAdd()">＋ 新增賓客</button></span></div>
   <div id="hList">${hostList()}</div>

  const cols=4;rest.forEach((t,i)=>{const r=Math.floor(i/cols),c=i%cols;const n=Math.min(cols,rest.length-r*cols);const span=n===1?0:(740/(cols-1));const start=500-span*(n-1)/2;t.x=start+c*span;t.y=480+r*225});
}

function towerModel(){
  const rows=[4,3,2,1],gl=[];   // r=0 bottom row
  rows.forEach((n,r)=>{for(let i=0;i<n;i++)gl.push({r,i,n,x:250-(n-1)*36+i*72,y:344-r*52})});
  const at=(r,i)=>gl.find(g=>g.r===r&&g.i===i);
  gl.forEach(g=>{g.parents=[at(g.r+1,g.i-1),at(g.r+1,g.i)].filter(Boolean)});
  // fill timing: a glass starts filling once a glass above it overflows; two inflows fill faster
  [...gl].sort((a,b)=>b.r-a.r).forEach(g=>{if(!g.parents.length){g.start=700;g.dur=1000}else{g.start=Math.min(...g.parents.map(p=>p.full))+80;g.dur=g.parents.length>1?650:1050}g.full=g.start+g.dur});
  return gl;
}

  const gl=towerModel();

   <g class="bubs ${ui.champDone?'on':''}" id="bub${k}">${[-12,0,10].map((bx,q)=>`<circle class="bub" cx="${bx}" cy="18" r="1.6" fill="#fff" style="animation-delay:${q*.5}s"/>`).join('')}</g>
   <path d="M-30 0 Q-28 22 0 24 Q28 22 30 0" fill="rgba(255,255,255,.22)" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.5"/><line x1="-30" y1="0" x2="30" y2="0" stroke="var(--ink)" stroke-opacity=".3"/>
   <line x1="0" y1="24" x2="0" y2="50" stroke="var(--ink)" stroke-opacity=".55" stroke-width="2"/><ellipse cx="0" cy="51" rx="14" ry="2.6" fill="none" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.5"/></g>`;
  // overflow streams: from a full glass's left/right rim, running down the outside of the bowl into the glass below
  const ovf=gl.filter(g=>g.r>0).flatMap(g=>{const k=gl.indexOf(g);return [-1,1].map(side=>`<path class="ovf" data-from="${k}" d="M${g.x+side*29} ${g.y+1} Q${g.x+side*37} ${g.y+10} ${g.x+side*35} ${g.y+60}" fill="none" stroke="#f3d27a" stroke-width="3" stroke-linecap="round"/>`)}).join('');
  return head('champagne','新人一起拔開軟木塞，把香檳倒進最上面的杯子。杯子滿了，香檳會從杯緣溢出、一層一層流進下面的杯子，象徵把幸福分享給每一位賓客。')+`<div class="card deco">

    <path id="stream" d="M0 0" fill="none" stroke="#f3d27a" stroke-width="4" stroke-linecap="round" class="stream" opacity="0"/>

function tiltBottle(from,to,ms,done){const t0=performance.now();(function f(now){const k=Math.min(1,(now-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;setBottle(from.map((v,i)=>v+(to[i]-v)*e));if(k<1)requestAnimationFrame(f);else done&&done()})(t0)}

function popCork(done){const svg=document.getElementById('ctower'),cork=document.getElementById('cork');if(!svg||!cork||cork.style.display==='none')return done();
  const t0=performance.now();
  (function wiggle(now){const k=(now-t0)/900;if(k<1){setBottle([REST[0],REST[1],REST[2]+Math.sin(k*Math.PI*10)*5*(1-k*.4)]);cork.setAttribute('transform',`translate(0,${-k*4})`);requestAnimationFrame(wiggle)}else{setBottle(REST);fly()}})(t0);
  function fly(){const bb=cork.getBBox();const pt=svg.createSVGPoint();pt.x=bb.x+bb.width/2;pt.y=bb.y+bb.height/2;
    const w=pt.matrixTransform(svg.getScreenCTM().inverse().multiply(cork.getScreenCTM()));cork.style.display='none';ui.corkOut=true;
    const ns='http://www.w3.org/2000/svg',mk=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);svg.appendChild(e);return e};
    const fc=mk('g',{});fc.innerHTML=CORK_SVG;
    const gk=TH(settings.theme).g;const txt=mk('text',{x:w.x-36,y:w.y-22,'text-anchor':'middle','font-size':30,'font-weight':700,fill:'var(--accent)','font-family':'var(--font-display)'});txt.textContent=gk==='jp'?'ポン！':gk==='west'?'Pop!':'啵！';
    const drops=Array.from({length:18},()=>{const a=-Math.PI/2+(Math.random()-.35)*1.1,sp=1.2+Math.random()*3.2;return {c:mk('circle',{r:(1.4+Math.random()*2.6).toFixed(1),fill:Math.random()<.6?'#fffbe8':'#f3d27a'}),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp}});
    const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;FX.burst(36,r.left+w.x/vb.width*r.width,r.top+w.y/vb.height*r.height);
    const s0=performance.now();
    (function f(now){const t=(now-s0)/16.7;fc.setAttribute('transform',`translate(${w.x+2.6*t},${w.y-5.6*t+.2*t*t}) rotate(${t*16})`);fc.setAttribute('opacity',Math.max(0,1-Math.max(0,t-38)/14));
      drops.forEach(d=>{d.c.setAttribute('cx',w.x+d.vx*t);d.c.setAttribute('cy',w.y+d.vy*t+.06*t*t);d.c.setAttribute('opacity',Math.max(0,1-t/36))});
      txt.setAttribute('opacity',Math.max(0,1-Math.max(0,t-30)/20));txt.setAttribute('transform',`translate(0,${-t*.3})`);
      if(t<52)requestAnimationFrame(f);else{fc.remove();txt.remove();drops.forEach(d=>d.c.remove());done()}})(s0)}}
function pourWine(b){
  const gl=towerModel(),top=gl.find(g=>!g.parents.length),st=document.getElementById('stream');
  const end=Math.max(...gl.map(g=>g.full));

function buildRsvpPlan(text){let rows=parseCSV(text);if(!rows.length)return null;let hm=mapHeaders(rows[0]);let legacy=false;
  if(hm.name==null){legacy=true;rows=String(text).split(/\r?\n/).map(l=>l.split(/[,，\t]/).map(x=>x.trim())).filter(r=>r[0]);hm={name:0,side:1,rel:2,count:3,table:4,pets:5}}else rows=rows.slice(1);
  const byName={};Object.values(guests).forEach(g=>byName[nkey(g.name)]=g);
  const plan={add:[],update:[],skip:[],bless:[],legacy};const seen=new Set();
  rows.forEach(r=>{const v=k=>hm[k]!=null?(r[hm[k]]||'').trim():'';const name=v('name');if(!name)return;const key=nkey(name);
    if(v('attend')&&/無法|不克|不會|不出席|不參加|缺席|decline|no\b|not/i.test(v('attend'))){plan.skip.push({name,why:'無法出席'});return}
    if(seen.has(key)){plan.skip.push({name,why:'重複填寫（已用較早的那筆）'});return}seen.add(key);
    const rec={name,side:hm.side!=null?parseSide(v('side')):'x',rel:v('rel'),count:Math.max(1,Math.min(20,parseInt(v('count'))||1))};
    if(hm.diet!=null)rec.diet=v('diet').split(/[,，、;；]/).map(x=>x.trim()).filter(x=>x&&!/^(無|沒有|none)$/i.test(x));
    if(hm.main!=null&&v('main')){const mm=mains().find(x=>x===v('main')||v('main').includes(x)||x.includes(v('main')));if(mm)rec.menu=mm}
    if(hm.pets!=null)rec.pets=parsePets(v('pets'));
    if(hm.bouquet!=null)rec.bouquet=/想|要|參加|是|yes/i.test(v('bouquet'))&&!/不/.test(v('bouquet'));
    if(hm.table!=null&&v('table')){const tn=parseInt(v('table'));const t=settings.tables.find(x=>x.n===tn)||settings.tables.find(x=>tName(x)===v('table'));if(t)rec.table=t.id}
    const ex=byName[key];(ex?plan.update:plan.add).push(Object.assign(rec,ex?{id:ex.id}:{}));
    if(hm.msg!=null&&v('msg'))plan.bless.push({name,text:v('msg').slice(0,200)})});
  return plan}
function rsvpPreviewHTML(){const pl=ui.rsvpPlan;if(!pl)return '';const all=[...pl.add.map(x=>[x,'新增']),...pl.update.map(x=>[x,'更新'])];
  return `<div class="payinfo" style="margin-top:12px"><b>預覽</b>：新增 <b>${pl.add.length}</b> 位、更新 <b>${pl.update.length}</b> 位、略過 <b>${pl.skip.length}</b> 位${pl.bless.length?`、附帶祝福 <b>${pl.bless.length}</b> 則`:''}${pl.legacy?'<span class="muted">（逐行格式）</span>':''}
   <div style="max-height:240px;overflow:auto;margin-top:8px"><table class="t" style="font-size:13px"><thead><tr><th></th><th>姓名</th><th>身分</th><th>人數</th><th>桌次</th></tr></thead><tbody>${all.map(([x,st])=>`<tr><td><span class="pill ${st==='新增'?'ok':''}">${st}</span></td><td>${esc(x.name)}${x.pets&&x.pets.length?' 🐾':''}</td><td>${esc(sideLabel(x.side))}</td><td>${x.count}</td><td>${x.table?esc(tName(tableById(x.table))):'<span class="muted">未安排</span>'}</td></tr>`).join('')}${pl.skip.map(x=>`<tr class="muted"><td><span class="pill">略過</span></td><td>${esc(x.name)}</td><td colspan="3">${esc(x.why)}</td></tr>`).join('')}</tbody></table></div>
   <div class="row" style="margin-top:10px"><button class="btn" onclick="rsvpApply()">✓ 確認匯入</button><button class="btn ghost" onclick="ui.rsvpPlan=null;openSettings('guests')">取消</button></div></div>`}
function rsvpShow(text){const pl=buildRsvpPlan(text);if(!pl||(!pl.add.length&&!pl.update.length&&!pl.skip.length)){toast('讀不到任何賓客資料，請確認內容');return}ui.rsvpPlan=pl;openSettings('guests');setTimeout(()=>document.getElementById('rsvpPrev')?.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
function rsvpPaste(){rsvpShow(document.getElementById('sImport').value)}
function rsvpFile(f){if(!f)return;const r=new FileReader();r.onload=()=>rsvpShow(r.result);r.onerror=()=>toast('無法讀取檔案');r.readAsText(f,'utf-8')}
async function rsvpSync(){let u=document.getElementById('rsvpUrl').value.trim();if(!/^https:\/\//.test(u))return toast('請貼上 https:// 開頭的網址');
  const m=/docs\.google\.com\/spreadsheets\/d\/([^/]+)\/(edit|view)?/.exec(u);if(m&&!/\/d\/e\//.test(u))u=`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv`;
  settings.rsvpUrl=document.getElementById('rsvpUrl').value.trim();putSettings();toast('讀取中…');
  try{const res=await fetch(u);if(!res.ok)throw new Error(res.status);const t=await res.text();if(/<html/i.test(t.slice(0,300)))throw new Error('html');rsvpShow(t)}
  catch(e){const inClaude=!!(window.claude&&window.claude.use);toast(inClaude?'Claude 分享頁面不能讀取外部網址，請改用上傳 CSV 或貼上':'讀不到試算表：請確認已「發布到網路」並選 CSV 格式，或改用上傳 CSV')}}
function rsvpApply(){const pl=ui.rsvpPlan;if(!pl)return;let n=0;
  pl.add.forEach(x=>{const g={id:uid(),name:x.name,side:x.side,rel:x.rel||'',count:x.count,invited:x.count,table:x.table||null,checked:false,bouquet:!!x.bouquet,diet:x.diet||[],menu:x.menu||null,note:'',pets:x.pets||[],ts:Date.now()};putGuest(g);n++});
  pl.update.forEach(x=>{const g=guests[x.id];if(!g)return;Object.assign(g,{side:x.side,count:x.count,invited:x.count});if(x.rel)g.rel=x.rel;['diet','menu','pets','bouquet','table'].forEach(k=>{if(x[k]!==undefined&&x[k]!==null&&!(Array.isArray(x[k])&&!x[k].length&&k!=='pets'))g[k]=x[k]});putGuest(g);n++});
  const have=new Set(Object.values(blessings).map(b=>b.name+'|'+b.text));let nb=0;pl.bless.forEach(b=>{if(have.has(b.name+'|'+b.text))return;const g=Object.values(guests).find(x=>nkey(x.name)===nkey(b.name));putBless({id:uid(),gid:g?g.id:null,name:b.name,text:b.text,color:Math.floor(Math.random()*3),ts:Date.now()});nb++});
  demo=false;ui.rsvpPlan=null;saveLocal();toast(`已匯入 ${n} 位賓客${nb?`、${nb} 則祝福`:''}`);render();openSettings('guests')}
function clearGuests(){if(!window._cg){window._cg=1;setTimeout(()=>window._cg=0,4000);return toast('再按一次確認清空名單')}window._cg=0;Object.keys(guests).forEach(delGuest);guests={};saveLocal();toast('已清空');render();openSettings('guests')}
function importGuests(){const ls=lines('sImport');let n=0;ls.forEach(l=>{const p=l.split(/[,，\t]/).map(s=>s.trim());if(!p[0])return;const sd=parseSide(p[1]);const tn=parseInt(p[4]);const t=settings.tables.find(x=>x.n===tn);putGuest({id:uid(),name:p[0],side:sd,rel:p[2]||'',count:Math.max(1,parseInt(p[3])||1),table:t?t.id:null,checked:false,bouquet:false,diet:[],menu:null,note:'',ts:Date.now(),pets:(p[5]||'').split(/[、\/]/).map(x=>x.trim()).filter(Boolean).map(n=>({name:n,kind:'狗',size:'小型',meal:null,note:''}))});n++});demo=false;saveLocal();toast(`已匯入 ${n} 位賓客`);render();openSettings()}
function importAll(){try{const d=JSON.parse(document.getElementById('sImp').value);if(d.settings){settings=migrate(Object.assign(defaultSettings(),d.settings))}guests=d.guests||guests;blessings=d.blessings||blessings;gifts=d.gifts||gifts;demo=false;saveLocal();
  if(cloud){putSettings();Object.values(guests).forEach(putGuest);Object.values(blessings).forEach(putBless);Object.values(gifts).forEach(putGift)}
  applyTheme();closeModal();render();toast('匯入完成')}catch(e){toast('格式不正確，請貼上完整的匯出內容')}}

/* ============ boot ============ */
setTimeout(()=>{if(document.body.classList.contains('booting')){ui.loading=false;render()}},12000);
BGM.loadFile();
loadLocal();{const m=/^#join-([A-Za-z0-9]+)/.exec(location.hash||'');if(m)ui.gatePrefill=fmtCode(normCode(m[1]))}applyTheme();render();
let wasStarted=null;setInterval(()=>{const st=isSync()&&liveStarted();if(wasStarted!==null&&st!==wasStarted){wasStarted=st;if(st&&!isHost()){FX.burst(160);toast('婚禮開始了！')}if(!document.querySelector('.modal-bg'))render();return}wasStarted=st;const w=document.getElementById('waitCd');if(w&&settings.live.startAt)w.innerHTML=cdHTML(settings.live.startAt);const lc=document.getElementById('liveCd');if(lc&&settings.live.startAt)lc.textContent=cdText(settings.live.startAt)},1000);setInterval(()=>{if(step==='home'&&!document.querySelector('.modal-bg'))softRender()},60000);
{const sv=fbSaved();const hm=/^#w-([a-z0-9]+)(?:-join-([A-Za-z0-9]+))?/i.exec(location.hash||'');
 if(sv&&sv.firebase&&sv.platform){fb.platform=true;fb.cfg=sv.firebase;
   if(hm){if(hm[2])ui.gatePrefill=fmtCode(normCode(hm[2]));ui.loading=true;document.body.classList.add('booting');render();
     fbConnect(sv.firebase,hm[1].toLowerCase()).then(async()=>{const x=await fb.m.getDoc(fdoc());if(!x.exists()){fb.on=false;ui.loading=false;ui.landing=true;ui.landingErr='找不到這場婚禮，請確認網址是否完整。';render();return}await fbStart();if(fb.host)addMyWedding()}).catch(e=>{ui.loading=false;ui.landing=true;ui.landingErr=fbErrMsg(e);render()})}
   else{settings=defaultSettings();guests={};blessings={};demo=false;ui.landing=true;applyTheme();render()}}
 else if(sv&&sv.firebase&&sv.wid){ui.loading=true;document.body.classList.add('booting');render();fbConnect(sv.firebase,sv.wid).then(fbStart).catch(e=>{ui.loading=false;fb.on=false;fb.status='⚠ 雲端連線失敗';setSync();render();toast(fbErrMsg(e))})}else initCloud();}
